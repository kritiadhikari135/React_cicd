name: deployDist
on: [push, workflow_dispatch]
# on:
#     - push
#     - workflow_dispatch
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/checkout@v7

            #   run:
            #     echo "cloning a repository"
            #     echo "${{toJson(github.repository)}}"
            #     git clone https://github.com/${{github.repository}}.git
            - name: Install node 20
              uses: actions/setup-node@v4
              with:
                node-version: 20
            # - name: print node version
            #   run: node -v
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test
    deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: get code
              uses: actions/checkout@v7
            - name: Install node 20
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name: Install dependencies
              run: npm ci
            - name: Build dist folder
              run: npm run build
            - name: Deploy
              run: echo "Deployed to server"


            
   